<style>
/* Layout: one narrow column — title, colour-key banner (doubles as filters), sticky search, alphabetical list */
:root{
  --bg:#f3f5f8; --card:#ffffff; --fg:#1d2433; --muted:#5d6779; --line:#d9dee7;
  --accent:#2f4f8f; --accent-soft:#e3e9f5; --play:#c2412d;
  --grey:#a6a6a6; --grey-bg:#e6e7ea; --grey-line:#c3c6cc;

  --banner:#ffffff;
  --display:"Rokkitt", Georgia, serif;
  --body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131722; --card:#1b2130; --fg:#e7eaf1; --muted:#9aa3b5; --line:#2c3446;
  --accent:#9db5ea; --accent-soft:#25304a; --play:#f08a74;
  --grey:#8a8f99; --grey-bg:#353a45; --grey-line:#565c69;
  --orange:#f0904f; --orange-bg:#3d2a1e; --orange-line:#8a5233;
  --banner:#1b2130; color-scheme:dark}}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:calc(28px + env(safe-area-inset-top, 0px));padding-bottom:calc(48px + env(safe-area-inset-bottom, 0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px}
h1{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1.05;margin:0;color:var(--accent)}
.sub{color:var(--muted);margin:0}
.key{background:var(--banner);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.key-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.key-t{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.02em}
.key-hint{font-size:.82rem;color:var(--muted)}
.key-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.k{font:inherit;color:var(--fg);text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;
  padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card)}
.k .sw{flex:none;width:22px;height:22px;border-radius:5px}
.k .lbl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.k .en{font-weight:600}
.k .fr{font-size:.88rem;color:var(--muted);font-style:italic}
.k .n{margin-left:auto;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.k[data-c="new"] .sw{background:var(--grey)}
.k[data-c="alt"] .sw{background:var(--orange)}
.k[aria-pressed="true"][data-c="new"]{background:var(--grey-bg);border-color:var(--grey)}
.k[aria-pressed="true"][data-c="alt"]{background:var(--orange-bg);border-color:var(--orange)}
.k:focus-visible,#q:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px;padding-top:calc(8px + env(safe-area-inset-top, 0px));margin-top:calc(-1 * env(safe-area-inset-top, 0px))}
#q{width:100%;box-sizing:border-box;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.filtering{font-size:.88rem;color:var(--muted);margin:6px 2px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filtering button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:999px;padding:2px 10px;cursor:pointer}
.letter{font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:2px;margin:10px 0 4px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
li.new{background:var(--grey-bg);border-color:var(--grey-line)}
li.alt{background:var(--orange-bg);border-color:var(--orange-line)}
.name{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.2;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
li.new .dot{background:var(--grey)} li.alt .dot{background:var(--orange)}
a.play{color:var(--fg);text-decoration:none;display:inline-flex;gap:8px;align-items:baseline}
a.play .tri{color:var(--play);font-size:.9em}
a.play:hover .t{text-decoration:underline;color:var(--accent)}
.meta{color:var(--muted);font-size:.93rem;overflow-wrap:anywhere}
.meta b{font-weight:600;color:var(--fg)}
.extras{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.chip{font-size:.8rem;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
a.chip{text-decoration:none;font-weight:600}
.tag{font-family:var(--body);font-weight:600;font-size:.75rem;line-height:1.3;padding:2px 8px;border-radius:6px;border:1px solid}
li.new .tag{border-color:var(--grey);color:var(--muted)}
li.alt .tag{border-color:var(--orange);color:var(--fg)}
.novid{font-size:.8rem;color:var(--muted);font-style:italic}
.empty{color:var(--muted);text-align:center;padding:24px}
@media (prefers-reduced-motion: no-preference){.k{transition:background .15s,border-color .15s}}
</style>

const $=id=>document.getElementById(id);
let cat="";
$("count").textContent=rows.length+" dances · tap a name to watch the video";
for(const c of ["new","alt"])$("n-"+c).textContent=rows.filter(r=>r.cat===c).length;
function render(){
  const t=norm($("q").value.trim());
  const show=rows.filter(r=>(!t||r.k.includes(t))&&(!cat||r.cat===cat));
  let html="",cur="",open=false;
  for(const r of show){
    const L=/[a-z]/i.test(r.n[0])?r.n[0].toUpperCase():"#";
    if(L!==cur){if(open)html+="</ul>";html+='<div class="letter">'+L+"</div><ul>";cur=L;open=true}
    const nm=r.u?'<a class="play" href="'+esc(r.u)+'" target="_blank" rel="noopener"><span class="tri">▶</span><span class="t">'+esc(r.n)+"</span></a>":esc(r.n);
    const tag=r.cat?'<span class="tag">'+esc(LABEL[r.cat][0])+' · '+esc(LABEL[r.cat][1])+"</span>":"";
    const meta=[r.c?"<b>"+esc(r.c)+"</b>":"",esc(r.m)].filter(Boolean).join(" · ");
    let ex=r.note?'<span class="chip">'+esc(r.note)+"</span>":"";
    for(const [lab,url] of r.extra)ex+='<a class="chip" href="'+esc(url)+'" target="_blank" rel="noopener">▶ '+esc(lab)+"</a>";
    if(!r.u)ex+='<span class="novid">no video yet</span>';
    html+='<li class="'+(r.cat||"")+'"><div class="name">'+nm+tag+'</div><div class="meta">'+meta+"</div>"+(ex?'<div class="extras">'+ex+"</div>":"")+"</li>";
  }
  if(open)html+="</ul>";
  $("list").innerHTML=html;$("none").hidden=show.length>0;
  $("filtering").hidden=!cat;
  if(cat)$("ftext").textContent="Showing / Affiché : "+LABEL[cat][0]+" · "+LABEL[cat][1];
  for(const c of ["new","alt"])$("k-"+c).setAttribute("aria-pressed",String(cat===c));
}
for(const c of ["new","alt"])$("k-"+c).addEventListener("click",()=>{cat=cat===c?"":c;render()});
$("clear").addEventListener("click",()=>{cat="";render()});
$("q").addEventListener("input",render);
render();
</script>
</body>
</html>
